<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Organization | TrustVault</title>
  <meta name="description" content="Create a new organization and admin account on TrustVault secure document sharing platform.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout" style="justify-content: center; align-items: center; padding: 2rem 1rem;">
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none;">
        <div class="brand-icon" style="width: 38px; height: 38px; font-size: 1.15rem;">T</div>
        <span style="font-size: 1.65rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.03em;">TrustVault</span>
      </a>
      <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.5rem;">
        Multi-Tenant Zero-Trust Document Infrastructure
      </p>
    </div>

    <!-- Auth Card -->
    <main class="panel" style="width: 100%; max-width: 440px; margin-bottom: 0; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);">
      <!-- Auth Switcher Tabs -->
      <div class="tabs" style="margin-bottom: 1.75rem;" role="tablist">
        <a href="/login.html" class="tab-btn" id="tab-login-btn" role="tab" aria-selected="false" style="flex: 1; text-align: center; text-decoration: none;">
          Sign In
        </a>
        <a href="/register.html" class="tab-btn active" id="tab-register-btn" role="tab" aria-selected="true" style="flex: 1; text-align: center; text-decoration: none;">
          Create Organization
        </a>
      </div>

      <!-- Alert / Error message container -->
      <div id="auth-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--status-danger);">
      </div>

      <!-- Register Form -->
      <form id="form-register" novalidate>
        <div class="form-group">
          <label for="register-name" class="form-label">Your Full Name</label>
          <input type="text" id="register-name" class="form-control" placeholder="Jane Doe" autocomplete="name" required autofocus>
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Work Email</label>
          <input type="email" id="register-email" class="form-control" placeholder="jane@organization.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="register-org" class="form-label">Organization / Team Name</label>
          <input type="text" id="register-org" class="form-control" placeholder="Acme Cyber Systems" autocomplete="organization" required>
        </div>

        <div class="form-group">
          <label for="register-password" class="form-label">Master Password (min 8 characters)</label>
          <input type="password" id="register-password" class="form-control" placeholder="••••••••" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit-register" style="width: 100%; margin-top: 0.5rem;">
          Create Organization & Admin Account
        </button>

        <div style="text-align: center; margin-top: 1.25rem;">
          <span style="color: var(--text-muted); font-size: 0.85rem;">Already have an account?</span>
          <a href="/login.html" id="link-to-login" style="color: var(--accent-primary); font-size: 0.85rem; font-weight: 500; margin-left: 0.35rem; text-decoration: none;">Sign In &rarr;</a>
        </div>
      </form>
    </main>

    <!-- Navigation Back Link -->
    <div style="margin-top: 1.5rem; text-align: center;">
      <a href="/" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">&larr; Return to Overview</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    (function () {
      'use strict';

      function showAlert(msg) {
        const alertBox = document.getElementById('auth-alert');
        if (alertBox) {
          alertBox.textContent = msg;
          alertBox.style.display = 'block';
        }
      }

      function clearAlert() {
        const alertBox = document.getElementById('auth-alert');
        if (alertBox) {
          alertBox.textContent = '';
          alertBox.style.display = 'none';
        }
      }

      async function handleRegisterSubmit(e) {
        e.preventDefault();
        clearAlert();

        const nameInput = document.getElementById('register-name');
        const emailInput = document.getElementById('register-email');
        const orgInput = document.getElementById('register-org');
        const passwordInput = document.getElementById('register-password');

        const name = nameInput ? nameInput.value.trim() : '';
        const email = emailInput ? emailInput.value.trim() : '';
        const organizationName = orgInput ? orgInput.value.trim() : '';
        const password = passwordInput ? passwordInput.value : '';
        const btn = document.getElementById('btn-submit-register');

        if (!name || !email || !organizationName || !password) {
          showAlert('Please fill out all fields.');
          return;
        }

        if (password.length < 8) {
          showAlert('Password must be at least 8 characters long.');
          if (passwordInput) passwordInput.focus();
          return;
        }

        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner" style="width: 14px; height: 14px;"></span> Creating Organization...';
        }

        try {
          const result = await window.TrustVault.auth.register({ name, email, password, organizationName });
          if (!result.success) {
            showAlert(result.error || 'Failed to create organization.');
            if (btn) {
              btn.disabled = false;
              btn.textContent = 'Create Organization & Admin Account';
            }
          }
        } catch (err) {
          showAlert('Network error during registration. Please try again.');
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Create Organization & Admin Account';
          }
        }
      }

      window.TrustVault.onReady(() => {
        window.TrustVault.auth.init({ requireAuth: false });
        const formRegister = document.getElementById('form-register');
        if (formRegister) {
          formRegister.addEventListener('submit', handleRegisterSubmit);
        }
      });
    })();
  </script>
</body>
</html>
